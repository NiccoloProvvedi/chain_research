[pytest]
testpaths = test
addopts = --strict-markers
markers =
    browser: uses the project's Chromium, without Internet access
    replay: replays the chains recorded in results/replay, without network or Claude
    network: makes real calls over the Internet
    claude: calls the real Claude (costs a few cents, needs a logged-in account)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
