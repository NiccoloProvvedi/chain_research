name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: |
          python -m venv venv
          venv/bin/pip install -r requirements-dev.txt
          PLAYWRIGHT_BROWSERS_PATH=browser/engines venv/bin/playwright install --with-deps chromium
      - name: Static checks
        run: |
          venv/bin/ruff check chain_research bench test
          node --check app/main.js
          node --check app/ui/app.js
      - name: Tests without Internet and without Claude
        run: |
          venv/bin/coverage run -m pytest -q -m "not network and not claude"
          venv/bin/coverage report
